name: iOS Deploy to TestFlight

# Mac を使わずに iPhone 実機テストするためのパイプライン。
# JJJJ / LLLLLLL の ios-deploy.yml と同じ構成。
#
# 起動方法:
#   git tag build-1 && git push origin build-1
#   もしくは Actions タブから手動実行 (その場合ビルド番号は run 番号を使う)

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

concurrency:
  group: ios-deploy
  cancel-in-progress: false

env:
  # Apple Developer / App Store Connect 側で作ったものと文字列が完全に一致していること。
  # ずれると archive か export のどちらかで必ず落ちる。
  IOS_BUNDLE_ID: com.tokinets.gimmick
  IOS_PROVISIONING_PROFILE_NAME: Gimmick Distribution

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE"
          echo "Using: $XCODE"; xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 姿勢判定は実機で目視確認する前にここで潰しておく。
      # 落ちた状態で TestFlight に上げても確認の往復が増えるだけなので、先に止める。
      - name: Run tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Sync iOS
        run: npx cap sync ios

      # ビルド番号(CURRENT_PROJECT_VERSION)は「タグ名 build-NN の NN」を唯一の正とする。
      # 手で上げ忘れると、全部成功したうえで最後のアップロードだけが 409
      # "The bundle version must be higher than the previously uploaded version" で落ちる。
      - name: Set build number
        run: |
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            build-*)
              BUILD_NO="${REF#build-}"
              case "$BUILD_NO" in
                ''|*[!0-9]*)
                  echo "::error::タグから数値のビルド番号を取り出せません: $REF （build-7 の形式にしてください）"
                  exit 1
                  ;;
              esac
              ;;
            *)
              BUILD_NO="${GITHUB_RUN_NUMBER}"
              echo "タグ起動ではないため run 番号を使います"
              ;;
          esac
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NO};/g" \
            ios/App/App.xcodeproj/project.pbxproj
          echo "build number = ${BUILD_NO}"

      # Team ID を Secret から pbxproj へ差し込む（プレースホルダ __APPLE_TEAM_ID__ を置換）。
      - name: Inject Team ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "::error::APPLE_TEAM_ID is empty"; exit 1; }
          sed -i '' "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n 'DEVELOPMENT_TEAM' ios/App/App.xcodeproj/project.pbxproj

      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE_BASE64" || { echo "::error::PROVISIONING_PROFILE_BASE64 is empty"; exit 1; }
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > app.mobileprovision
          cp app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          # どのプロファイルで署名しているかを後からログで追えるようにしておく。
          security cms -D -i app.mobileprovision > app.plist
          echo "profile name  : $(/usr/libexec/PlistBuddy -c 'Print :Name' app.plist)"
          echo "profile app id: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' app.plist)"

      - name: Build & Archive iOS
        run: |
          # 署名設定は App ターゲットの build settings 側に持たせる（project.pbxproj）。
          # ここでコマンドラインに渡すと SPM 依存にも波及して
          # "does not support provisioning profiles" で archive が失敗するため、渡さない。
          #
          # Capacitor 8 は CocoaPods ではなく SPM を使うので workspace ではなく project を指定する。
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist
          IPA=$(find build/ipa -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::IPA が生成されていません"; exit 1; }
          echo "IPA_PATH=${IPA}" >> "$GITHUB_ENV"
          echo "IPA: ${IPA}"

      - name: Upload to App Store Connect (TestFlight)
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.IOS_KEY_ID }}
          api-private-key: ${{ secrets.IOS_API_KEY }}
          # アップロード後の「処理完了待ち」を無効化。待機中に API トークンが期限切れになり
          # 401 でワークフローが失敗表示になるのを防ぐ。アップロード自体は待ち有無に関係なく完了する。
          wait-for-processing: false
