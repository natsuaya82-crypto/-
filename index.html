<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover でノッチ端末でも全画面。ユーザー拡大は無効にする。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11131a" />
    <meta name="description" content="Turn the phone itself to roll the ball into the goal." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Gravity Room</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- 文言は data-i18n をキーに JS から流し込む。HTML には原文を書かない。 -->
    <div id="game">
      <header class="game-bar">
        <span class="game-stage" data-game="stage"></span>
        <span class="game-turns" data-game="turns"></span>
        <!-- センサーが繋がっているかを常に出す。黙って代替動作に落ちると原因が分からない。 -->
        <button type="button" class="game-status" data-game="status">
          <span class="game-status-dot" data-game="status-dot"></span>
          <span data-game="status-label"></span>
        </button>
        <button type="button" class="game-retry" data-game="retry" data-i18n="ui.retry"></button>
      </header>

      <div class="game-diagnostics" data-game="diagnostics" hidden>
        <p class="game-diagnostics-title" data-i18n="diag.title"></p>
        <dl class="game-diagnostics-rows">
          <dt data-i18n="diag.source"></dt><dd data-diag="source">—</dd>
          <dt data-i18n="diag.gravity"></dt><dd data-diag="gravity">—</dd>
          <dt data-i18n="diag.embedded"></dt><dd data-diag="embedded">—</dd>
          <dt data-i18n="diag.reason"></dt><dd data-diag="reason">—</dd>
        </dl>
        <p class="game-diagnostics-note" data-i18n="diag.movingHint"></p>
        <div data-diag="causes" hidden>
          <p class="game-diagnostics-title" data-i18n="diag.simulatedCause"></p>
          <p class="game-diagnostics-note" data-i18n="diag.causeEmbedded"></p>
          <p class="game-diagnostics-note" data-i18n="diag.causeDenied"></p>
          <p class="game-diagnostics-note" data-i18n="diag.causeHttp"></p>
          <button type="button" class="game-diagnostics-retry" data-diag="retry" data-i18n="diag.retry"></button>
        </div>
        <button type="button" class="game-diagnostics-close" data-diag="close" data-i18n="status.close"></button>
      </div>

      <!-- センサーが使えない環境向けの操作説明。実機では隠す。 -->
      <p class="game-tilt-hint" data-game="tilt-hint" data-i18n="ui.tiltHint" hidden></p>

      <div class="game-overlay" data-game="overlay" hidden>
        <p class="game-overlay-title" data-game="overlay-title"></p>
        <p class="game-overlay-note" data-game="overlay-note"></p>
        <button type="button" class="game-next" data-game="next"></button>
      </div>
    </div>

    <!-- 開発用。?debug=1 のときだけ表示する。 -->
    <div id="hud" hidden>
      <p class="hud-caption" data-i18n="hud.caption"></p>
      <p class="hud-state" data-hud="state">Unknown</p>

      <dl class="hud-rows">
        <dt data-i18n="hud.roll"></dt><dd data-row="roll">—</dd>
        <dt data-i18n="hud.source"></dt><dd data-row="source">—</dd>
        <dt data-i18n="hud.available"></dt><dd data-row="available">—</dd>
        <dt data-i18n="hud.flat"></dt><dd data-row="flat">—</dd>
        <dt data-i18n="hud.rawGravity"></dt><dd data-row="raw">—</dd>
        <dt data-i18n="hud.smoothed"></dt><dd data-row="smoothed">—</dd>
        <dt data-i18n="hud.worldGravity"></dt><dd data-row="world">—</dd>
        <dt data-i18n="hud.osOrientation"></dt><dd data-row="os">—</dd>
      </dl>

      <button type="button" class="hud-invert" data-hud="invert" data-i18n="hud.invert"></button>
    </div>

    <div id="start-overlay">
      <div class="start-panel">
        <h1 data-i18n="start.title"></h1>
        <p data-i18n="start.description"></p>
        <!-- iOS はユーザー操作の中でしかモーションセンサーの許可を求められない。 -->
        <button type="button" id="start-button" data-i18n="start.button"></button>
        <p id="start-message"></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
