<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover でノッチ端末でも全画面。ユーザー拡大は無効にする。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11131a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Gravity Room</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud">
      <p class="hud-caption">ORIENTATION STATE</p>
      <p class="hud-state" data-hud="state">Unknown</p>

      <dl class="hud-rows">
        <dt>Roll</dt><dd data-row="roll">—</dd>
        <dt>Source</dt><dd data-row="source">—</dd>
        <dt>Available</dt><dd data-row="available">—</dd>
        <dt>Flat</dt><dd data-row="flat">—</dd>
        <dt>Raw gravity</dt><dd data-row="raw">—</dd>
        <dt>Smoothed</dt><dd data-row="smoothed">—</dd>
        <dt>World gravity</dt><dd data-row="world">—</dd>
        <dt>OS orientation</dt><dd data-row="os">—</dd>
      </dl>

      <div class="hud-simulation" data-hud="simulation" hidden></div>

      <button type="button" class="hud-invert" data-hud="invert">
        上下が逆に出るときはここをタップ
      </button>
    </div>

    <div id="start-overlay">
      <div class="start-panel">
        <h1>Phase 0</h1>
        <p>端末の姿勢を検出します。</p>
        <!-- iOS はユーザー操作の中でしかモーションセンサーの許可を求められない。 -->
        <button type="button" id="start-button">タップして開始</button>
        <p id="start-message"></p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
